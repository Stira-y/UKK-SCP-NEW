<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - Sistem SCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <nav class="bg-emerald-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">SCP Sekolah - Panel Guru</h1>
        <button id="btnLogout" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
            Keluar
        </button>
    </nav>

    <main class="max-w-4xl mx-auto mt-10 p-6">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center border border-slate-200">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Selamat Datang, <span id="userName" class="text-emerald-600">Guru</span>!</h2>
            <p class="text-slate-600">Anda berhasil masuk ke Panel Staf Pengajar.</p>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('auth_token');
        const userData = JSON.parse(localStorage.getItem('user_data') || '{}');

        // Proteksi: Cek Token & Role Guru (id_role = 2)
        if (!token || userData.id_role !== 2) {
            alert('Akses ditolak! Silakan login sebagai Guru.');
            window.location.href = '../login/login.html';
        } else {
            document.getElementById('userName').textContent = userData.fullname || userData.username;
        }

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '../login/login.html';
        });
    </script>
</body>
</html>
