<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Masuk - Sistem SCP Sekolah</title>
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SCP Sekolah">
    <script src="/js/pwa.js?v=20261109_3.0"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">
        <div class="text-center">
            <img src="../icons/logo-smkn1bantul.png" alt="Logo SMKN 1 Bantul" class="w-20 h-20 mx-auto mb-3 object-contain drop-shadow-md">
            <h1 class="text-2xl font-bold text-gray-900">Sistem SCP Sekolah</h1>
            <p class="text-sm text-gray-500 mt-1">SMK Negeri 1 Bantul</p>
        </div>

        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="login_input" class="block text-sm font-medium text-gray-700 mb-1">Email, Username, atau NIS</label>
                <input 
                    type="text" 
                    id="login_input" 
                    name="login_input" 
                    required 
                    placeholder="Masukkan Email, Username, atau NIS"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                >
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
                    <a href="lupapw.html" class="text-xs text-indigo-600 hover:text-indigo-500 font-medium">Lupa Password?</a>
                </div>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition pr-10"
                    >
                    <button 
                        type="button" 
                        id="togglePassword" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                    >
                        <!-- Ikon Mata Terbuka (saat password tampil) -->
                        <svg id="eyeOpen" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <!-- Ikon Mata Tertutup dengan Garis Miring (saat password tersembunyi) -->
                        <svg id="eyeClosed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button 
                type="submit" 
                id="btnSubmit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-md flex items-center justify-center space-x-2 mt-6"
            >
                <span id="btnText">Masuk</span>
                <span id="btnSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></span>
            </button>
        </form>
    </div>

    <!-- Script JavaScript -->
    <script>
        // PWA: Registrasi Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }

        // Auto-Login: Mengingat Sesi Akun di Perangkat Selama 30 Hari
        (function checkExistingSession() {
            const existingToken = localStorage.getItem('auth_token');
            const existingUserStr = localStorage.getItem('user_data');
            const loginTimestamp = localStorage.getItem('login_timestamp');

            if (existingToken && existingUserStr) {
                let isExpired = false;
                if (loginTimestamp) {
                    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
                    if (Date.now() - Number(loginTimestamp) > THIRTY_DAYS_MS) {
                        isExpired = true;
                    }
                }

                if (isExpired) {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                    localStorage.removeItem('login_timestamp');
                } else {
                    try {
                        const user = JSON.parse(existingUserStr);
                        const roleId = Number(user.id_role);
                        if (roleId === 1) {
                            window.location.replace('../role 1 waka/dashboard1.html');
                        } else if (roleId === 2) {
                            window.location.replace('../role 2 guru/dashboard2.html');
                        } else if (roleId === 3) {
                            window.location.replace('../role 3 walikelas&bk/dashboard3.html');
                        } else if (roleId === 4) {
                            window.location.replace('../role 4 siswa/dashboard4.html');
                        }
                    } catch (e) {
                        // ignore error
                    }
                }
            }
        })();

        // Deteksi URL API secara dinamis (Laragon vs Hosting)
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_BASE_URL = isLocalhost 
            ? 'http://localhost/ukk-scp-new/public/api' 
            : `${window.location.origin}/api`;

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        const loginInput = document.getElementById('login_input');
        const passwordInput = document.getElementById('password');

        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        // Mencegah pengetikan spasi pada input password
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
            }
        });

        // Mencegah spasi yang masuk melalui metode lain (copy-paste / autofill)
        passwordInput.addEventListener('input', () => {
            passwordInput.value = passwordInput.value.replace(/\s/g, '');
        });

        // Toggle Fitur Lihat/Sembunyikan Password
        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            } else {
                passwordInput.type = 'password';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            }
        });

        function showAlert(message, isSuccess = false) {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200', 'border');
            if (isSuccess) {
                alertBox.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
            } else {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            }
            alertBox.textContent = message;
        }

        function setLoading(isLoading) {
            btnSubmit.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Memproses...';
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.textContent = 'Masuk';
                btnSpinner.classList.add('hidden');
            }
        }

        function getLockoutState() {
            const attempts = parseInt(localStorage.getItem('login_fail_attempts') || '0', 10);
            const lastFail = parseInt(localStorage.getItem('login_last_fail_time') || '0', 10);
            const lockedUntil = parseInt(localStorage.getItem('login_locked_until') || '0', 10);
            const now = Date.now();

            // Jika sedang dalam masa lockout 1 jam
            if (lockedUntil && now < lockedUntil) {
                const remainingMinutes = Math.ceil((lockedUntil - now) / 60000);
                return { isLocked: true, remainingMinutes, attempts };
            }

            // Jika sudah lewat masa lockout 1 jam, reset
            if (lockedUntil && now >= lockedUntil) {
                localStorage.removeItem('login_locked_until');
                localStorage.removeItem('login_fail_attempts');
                localStorage.removeItem('login_last_fail_time');
                return { isLocked: false, remainingMinutes: 0, attempts: 0 };
            }

            // Jika gagal 1-4 kali, tapi tidak sampai ke-5 dan sudah lewat 30 menit, reset counter
            if (attempts > 0 && lastFail && (now - lastFail > 30 * 60 * 1000)) {
                localStorage.removeItem('login_fail_attempts');
                localStorage.removeItem('login_last_fail_time');
                return { isLocked: false, remainingMinutes: 0, attempts: 0 };
            }

            return { isLocked: false, remainingMinutes: 0, attempts };
        }

        function recordLoginFailure() {
            let state = getLockoutState();
            let attempts = state.attempts + 1;
            const now = Date.now();

            localStorage.setItem('login_last_fail_time', now.toString());

            if (attempts >= 5) {
                const lockoutDuration = 60 * 60 * 1000; // 1 Jam
                const lockedUntil = now + lockoutDuration;
                localStorage.setItem('login_locked_until', lockedUntil.toString());
                localStorage.setItem('login_fail_attempts', '5');
                showAlert('Anda telah gagal login sebanyak 5 kali. Akun terkunci sementara selama 1 jam demi keamanan.', false);
            } else {
                localStorage.setItem('login_fail_attempts', attempts.toString());
                showAlert(`Username/Email/NIS atau kata sandi salah. Percobaan gagal ke-${attempts} dari 5.`, false);
            }
        }

        function recordLoginSuccess() {
            localStorage.removeItem('login_fail_attempts');
            localStorage.removeItem('login_last_fail_time');
            localStorage.removeItem('login_locked_until');
        }

        // Periksa status saat halaman dimuat
        const initialLockout = getLockoutState();
        if (initialLockout.isLocked) {
            showAlert(`Akses login sedang terkunci karena 5 kali percobaan gagal. Silakan coba lagi dalam ${initialLockout.remainingMinutes} menit.`, false);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const lockout = getLockoutState();
            if (lockout.isLocked) {
                showAlert(`Akses login sedang diblokir selama 1 jam karena gagal login 5 kali berturut-turut. Sisa waktu: ${lockout.remainingMinutes} menit.`, false);
                return;
            }

            const loginValue = loginInput.value.trim();
            const passwordValue = passwordInput.value;
            const loginEndpoint = `${API_BASE_URL}/login`;

            setLoading(true);
            alertBox.classList.add('hidden');

            try {
                const response = await fetch(loginEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: loginValue,
                        password: passwordValue
                    })
                });

                const responseText = await response.text();
                let result = null;
                try {
                    result = responseText ? JSON.parse(responseText) : null;
                } catch {
                    result = null;
                }

                if (!response.ok) {
                    recordLoginFailure();
                    setLoading(false);
                    return;
                }

                if (!result) {
                    showAlert(`Server mengirim respons bukan JSON (HTTP ${response.status}). Endpoint: ${loginEndpoint}`, false);
                    setLoading(false);
                    return;
                }

                if (result.status === 'success') {
                    recordLoginSuccess();
                    localStorage.setItem('auth_token', result.data.token);
                    localStorage.setItem('user_data', JSON.stringify(result.data.user));
                    localStorage.setItem('login_timestamp', String(Date.now()));

                    showAlert('Login berhasil! Mengalihkan...', true);

                    setTimeout(() => {
                        const user = result.data.user;
                        const userTitle = (user.title || '').replace(/\s+/g, '').toLowerCase();

                        if (user.id_role === 1) {
                            window.location.href = '../role 1 waka/dashboard1.html';
                        } else if (user.id_role === 2) {
                            window.location.href = '../role 2 guru/dashboard2.html';
                        } else if (user.id_role === 3) {
                            window.location.href = '../role 3 walikelas&bk/dashboard3.html';
                        } else if (user.id_role === 4) {
                            window.location.href = '../role 4 siswa/dashboard4.html';
                        } else {
                            showAlert('Role pengguna tidak dikenal.', false);
                            setLoading(false);
                        }
                    }, 1000);
                } else {
                    recordLoginFailure();
                    setLoading(false);
                }
            } catch (error) {
                const reason = error instanceof Error ? error.message : String(error);
                showAlert(`Koneksi ke ${loginEndpoint} gagal (${reason}). Periksa alamat API, SSL, dan konfigurasi hosting.`, false);
                console.error('Login error:', error);
                setLoading(false);
            }
        });
    </script>
</body>
</html>
