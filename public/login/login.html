<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 relative">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Sistem SCP Sekolah</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masuk menggunakan akun Anda</p>
        </div>

        <!-- Alert Notifikasi Error / Sukses -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <!-- Input Email / Username -->
            <div>
                <label for="login_input" class="block text-sm font-medium text-slate-700 mb-1">Email atau Username</label>
                <input 
                    type="text" 
                    id="login_input" 
                    name="login_input" 
                    required 
                    autocomplete="off"
                    placeholder="Masukkan email atau username"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150"
                >
            </div>

            <!-- Input Password -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-sm font-medium text-slate-700">Kata Sandi</label>
                    <a href="lupapw.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition duration-150">
                        Lupa Password?
                    </a>
                </div>
                
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                        class="w-full px-4 py-2.5 pr-11 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150"
                    />
                    <!-- Tombol Toggle Mata (Show/Hide Password) -->
                    <button 
                        type="button" 
                        id="togglePassword" 
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                    >
                        <!-- Ikon Mata Terbuka (Show) -->
                        <svg id="eyeOpen" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <!-- Ikon Mata Tertutup / Ada Coretan Slash (Hide) -->
                        <svg id="eyeClosed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.03 10.03 0 013.122-.382c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21f-11 11L3 3l12 12z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button 
                type="submit" 
                id="btnSubmit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md flex items-center justify-center space-x-2 mt-6"
            >
                <span id="btnText">Masuk</span>
                <span id="btnSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></span>
            </button>
        </form>
    </div>

    <!-- Script JavaScript -->
    <script>
        const API_BASE_URL = 'http://localhost/ukk-scp-new/public/api';

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        const loginInput = document.getElementById('login_input');
        const passwordInput = document.getElementById('password');

        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        // Mencegah pengetikan spasi pada input password
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
            }
        });

        // Mencegah spasi yang masuk melalui metode lain (copy-paste / autofill)
        passwordInput.addEventListener('input', () => {
            passwordInput.value = passwordInput.value.replace(/\s/g, '');
        });

        // Toggle Fitur Lihat/Sembunyikan Password
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            if (isPassword) {
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            } else {
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            }
        });

        function showAlert(message, isSuccess = false) {
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (isSuccess) {
                alertBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-700');
            }
            alertBox.textContent = message;
        }

        function setLoading(isLoading) {
            btnSubmit.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Memproses...';
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.textContent = 'Masuk';
                btnSpinner.classList.add('hidden');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginValue = loginInput.value.trim();
            const passwordValue = passwordInput.value;

            setLoading(true);
            alertBox.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: loginValue,
                        password: passwordValue
                    })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    localStorage.setItem('auth_token', result.data.token);
                    localStorage.setItem('user_data', JSON.stringify(result.data.user));

                    showAlert('Login berhasil! Mengalihkan...', true);

                    setTimeout(() => {
                        const user = result.data.user;

                        if (user.id_role === 1) {
                            window.location.href = '../role 1 waka/dashboard1.html';
                        } else if (user.id_role === 2) {
                            window.location.href = '../role 2 guru/dashboard2.html';
                        } else if (user.id_role === 3) {
                            window.location.href = '../role 3 walikelas&bk/dashboard3.html';
                        } else if (user.id_role === 4) {
                            window.location.href = '../role 4 siswa/dashboard4.html';
                        } else {
                            showAlert('Role pengguna tidak dikenal.', false);
                        }
                    }, 1000);
                } else {
                    showAlert(result.message || 'Username/email atau password salah', false);
                }
            } catch (error) {
                showAlert('Tidak dapat terhubung ke server backend API. Pastikan Apache & MySQL berjalan.', false);
                console.error('Login error:', error);
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
