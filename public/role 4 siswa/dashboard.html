<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa - Sistem SCP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.js CSS & JS untuk Fitur Crop dan Rotate Image -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar Utama -->
    <nav class="bg-indigo-600 text-white px-4 md:px-6 py-3 flex justify-between items-center shadow-md z-30 sticky top-0">
        <div class="flex items-center space-x-3 md:space-x-4">
            <!-- Tombol Garis 3 -->
            <button id="toggleSidebarNav" class="p-2 text-indigo-100 hover:text-white hover:bg-indigo-700/50 rounded-lg focus:outline-none transition md:pointer-events-none md:opacity-50 md:cursor-not-allowed" aria-label="Toggle Navigation">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Menu Profil Ringkas (Klik untuk Buka Pop-up Profil) -->
            <div id="btnOpenProfile" class="flex items-center space-x-2 bg-indigo-700/60 hover:bg-indigo-700/90 px-3 py-1.5 rounded-full border border-indigo-400/30 cursor-pointer transition">
                <!-- Foto Profile Avatar -->
                <div class="w-7 h-7 rounded-full bg-indigo-200 text-indigo-800 flex items-center justify-center font-bold text-xs shadow-sm overflow-hidden flex-shrink-0">
                    <img id="navAvatarImg" src="" class="w-full h-full object-cover hidden" alt="Avatar">
                    <svg id="navAvatarSvg" class="w-5 h-5 text-indigo-600 mt-1" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <!-- Text Nama & NIS -->
                <div class="text-xs md:text-sm font-medium flex items-center space-x-1.5 truncate max-w-[150px] sm:max-w-[250px] md:max-w-none">
                    <span id="navFullname" class="font-semibold truncate">Siswa</span>
                    <span class="text-indigo-300">|</span>
                    <span id="navNis" class="text-indigo-200 text-xs">-</span>
                </div>
            </div>

            <!-- Judul Panel -->
            <h1 class="hidden lg:block text-base md:text-lg font-bold border-l border-indigo-400/40 pl-4">
                SCP Sekolah - Panel Siswa
            </h1>
        </div>

        <!-- Tombol Keluar -->
        <button id="btnLogout" class="bg-red-500 hover:bg-red-600 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition flex-shrink-0">
            Keluar
        </button>
    </nav>

    <div class="flex flex-1 relative overflow-hidden">
        <!-- Overlay Gelap Sidebar HP -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden transition-opacity duration-300"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static top-[57px] bottom-0 left-0 w-64 bg-white border-r border-slate-200 p-5 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-30 h-[calc(100vh-57px)]">
            <div class="space-y-6">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Navigasi Utama</span>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 bg-indigo-50 text-indigo-600 font-semibold rounded-xl transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        <span>Dashboard</span>
                    </a>

                    <a href="suratizin.html" class="flex items-center space-x-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 font-medium rounded-xl transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span>Surat Izin</span>
                    </a>
                </nav>
            </div>
            
            <div class="border-t border-slate-100 pt-4 text-xs text-slate-400 text-center">
                Sistem SCP &copy; 2026
            </div>
        </aside>

        <!-- Konten Utama -->
        <main class="flex-1 p-4 md:p-10 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg text-center border border-slate-200">
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">
                        Selamat Datang, <span id="userName" class="text-indigo-600">Siswa</span>!
                    </h2>
                    <p class="text-slate-600 text-sm md:text-base">Anda berhasil masuk ke Panel Siswa.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Profil User -->
    <div id="profileModal" class="fixed inset-0 bg-slate-900/60 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <!-- Header Modal -->
            <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">Profil Saya</h3>
                <button id="btnCloseProfile" class="text-indigo-200 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <!-- Body Modal -->
            <div class="p-6 space-y-4">
                <!-- Foto Profil -->
                <div class="flex flex-col items-center justify-center">
                    <div class="relative group">
                        <div class="w-24 h-24 rounded-full bg-slate-200 border-4 border-indigo-100 flex items-center justify-center overflow-hidden shadow-md">
                            <img id="modalAvatarImg" src="" class="w-full h-full object-cover hidden" alt="Foto Profil">
                            <svg id="modalAvatarSvg" class="w-16 h-16 text-slate-400 mt-2" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                        </div>
                        <label for="inputAvatar" class="absolute bottom-0 right-0 bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-full cursor-pointer shadow-md transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                <circle cx="12" cy="13" r="3" stroke-width="2"></circle>
                            </svg>
                        </label>
                        <input type="file" id="inputAvatar" accept="image/*" class="hidden">
                    </div>
                    <span class="text-xs text-slate-400 mt-2">Klik ikon kamera untuk mengganti foto</span>
                </div>

                <!-- Nama Lengkap -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nama Lengkap</label>
                    <input type="text" id="modalFullname" readonly class="w-full px-3.5 py-2 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 text-sm font-semibold outline-none cursor-not-allowed">
                </div>

                <!-- Username & Password Baru -->
                <div>
                    <label for="modalUsername" class="block text-xs font-semibold text-slate-500 uppercase mb-1">Username</label>
                    <input type="text" id="modalUsername" placeholder="Masukkan username baru..." class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition">
                </div>

                <div>
                    <label for="modalPassword" class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password Baru</label>
                    <input type="password" id="modalPassword" placeholder="Biarkan kosong jika tidak diganti" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition">
                </div>

                <!-- NIS & NISN -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">NIS</label>
                        <input type="text" id="modalNis" readonly class="w-full px-3.5 py-2 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 text-sm outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">NISN</label>
                        <input type="text" id="modalNisn" readonly class="w-full px-3.5 py-2 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 text-sm outline-none cursor-not-allowed">
                    </div>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="bg-slate-50 px-6 py-3.5 flex justify-end space-x-2 border-t border-slate-200">
                <button id="btnCancelProfile" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition">
                    Batal
                </button>
                <button id="btnSaveProfile" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Crop & Rotate Gambar -->
    <div id="cropModal" class="fixed inset-0 bg-slate-900/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base">Potong & Putar Foto</h3>
                <button id="btnCloseCrop" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <div class="p-4 flex-1 overflow-hidden flex items-center justify-center bg-slate-950">
                <div class="max-h-[60vh] w-full flex items-center justify-center">
                    <img id="cropImage" class="max-w-full max-h-[50vh] block" alt="Gambar Crop">
                </div>
            </div>

            <!-- Kontrol Putar Gambar -->
            <div class="bg-slate-100 p-3 flex justify-center space-x-4 border-t border-slate-200">
                <button id="btnRotateLeft" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span>Putar Kiri</span>
                </button>
                <button id="btnRotateRight" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-sm">
                    <span>Putar Kanan</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>

            <div class="bg-white px-6 py-3.5 flex justify-end space-x-2 border-t border-slate-200">
                <button id="btnCancelCrop" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-medium transition">
                    Batal
                </button>
                <button id="btnApplyCrop" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow">
                    Gunakan Foto Ini
                </button>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const API_BASE_URL = 'http://localhost/ukk-scp-new/public/api';

        const token = localStorage.getItem('auth_token');
        const userData = JSON.parse(localStorage.getItem('user_data') || '{}');

        // Elemen DOM Profile
        const navFullname = document.getElementById('navFullname');
        const navNis = document.getElementById('navNis');
        const userName = document.getElementById('userName');
        const navAvatarImg = document.getElementById('navAvatarImg');
        const navAvatarSvg = document.getElementById('navAvatarSvg');

        const profileModal = document.getElementById('profileModal');
        const btnOpenProfile = document.getElementById('btnOpenProfile');
        const btnCloseProfile = document.getElementById('btnCloseProfile');
        const btnCancelProfile = document.getElementById('btnCancelProfile');
        const btnSaveProfile = document.getElementById('btnSaveProfile');

        const modalAvatarImg = document.getElementById('modalAvatarImg');
        const modalAvatarSvg = document.getElementById('modalAvatarSvg');
        const modalFullname = document.getElementById('modalFullname');
        const modalUsername = document.getElementById('modalUsername');
        const modalPassword = document.getElementById('modalPassword');
        const modalNis = document.getElementById('modalNis');
        const modalNisn = document.getElementById('modalNisn');
        const inputAvatar = document.getElementById('inputAvatar');

        // Elemen Crop
        const cropModal = document.getElementById('cropModal');
        const cropImage = document.getElementById('cropImage');
        const btnCloseCrop = document.getElementById('btnCloseCrop');
        const btnCancelCrop = document.getElementById('btnCancelCrop');
        const btnApplyCrop = document.getElementById('btnApplyCrop');
        const btnRotateLeft = document.getElementById('btnRotateLeft');
        const btnRotateRight = document.getElementById('btnRotateRight');

        let cropper = null;
        let tempCroppedImageBase64 = null;

        // 1. Proteksi & Render Awal
        if (!token || userData.id_role !== 4) {
            alert('Akses ditolak! Silakan login sebagai Siswa.');
            window.location.href = '../login/login.html';
        } else {
            renderProfileData();
        }

        function renderProfileData() {
            // Ambil data user paling mutakhir dari localStorage
            const currentData = JSON.parse(localStorage.getItem('user_data') || '{}');

            const fullname = currentData.fullname || currentData.username || 'Siswa';
            const username = currentData.username || '';
            const nis = currentData.nis || '-';
            const nisn = currentData.nisn || '-';
            
            // Ambil URL avatar: utamakan avatar_url dari backend, jika tidak ada rakit path storage-nya
            let avatarSrc = currentData.avatar_url || null;
            if (!avatarSrc && currentData.avatar) {
                avatarSrc = `${API_BASE_URL.replace('/api', '')}/storage/${currentData.avatar}`;
            }

            userName.textContent = fullname;
            navFullname.textContent = fullname;
            navNis.textContent = nis;

            modalFullname.value = fullname;
            modalUsername.value = username;
            modalPassword.value = ''; // Selalu kosongkan input password
            modalNis.value = nis;
            modalNisn.value = nisn;

            updateAvatarUI(avatarSrc);
        }

        function updateAvatarUI(avatarSrc) {
            if (avatarSrc) {
                navAvatarImg.src = avatarSrc;
                navAvatarImg.classList.remove('hidden');
                navAvatarSvg.classList.add('hidden');

                modalAvatarImg.src = avatarSrc;
                modalAvatarImg.classList.remove('hidden');
                modalAvatarSvg.classList.add('hidden');
            } else {
                navAvatarImg.classList.add('hidden');
                navAvatarSvg.classList.remove('hidden');

                modalAvatarImg.classList.add('hidden');
                modalAvatarSvg.classList.remove('hidden');
            }
        }

        // 2. Modal Profil Open/Close
        btnOpenProfile.addEventListener('click', () => {
            tempCroppedImageBase64 = null;
            renderProfileData();
            profileModal.classList.remove('hidden');
        });

        function closeProfileModal() {
            profileModal.classList.add('hidden');
        }

        btnCloseProfile.addEventListener('click', closeProfileModal);
        btnCancelProfile.addEventListener('click', closeProfileModal);

        // 3. Simpan Profil (Username, Password, & Foto Profil)
        btnSaveProfile.addEventListener('click', async () => {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                alert('Sesi anda telah berakhir. Silakan login kembali.');
                window.location.href = '../login/login.html';
                return;
            }

            const formData = new FormData();
            formData.append('username', modalUsername.value.trim());

            if (modalPassword.value.trim() !== '') {
                formData.append('password', modalPassword.value.trim());
            }

            // Jika user mengunggah/memotong foto baru (Base64)
            if (tempCroppedImageBase64) {
                // Konversi gambar Base64 menjadi Blob/File
                const responseBlob = await fetch(tempCroppedImageBase64);
                const blob = await responseBlob.blob();
                formData.append('avatar', blob, 'avatar.jpg');
            }

            try {
                btnSaveProfile.disabled = true;
                btnSaveProfile.textContent = 'Menyimpan...';

                const response = await fetch(`${API_BASE_URL}/profile/update`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    const updatedUser = result.data || result.user || result;

                    // 1. Simpan user data terbaru ke localStorage
                    localStorage.setItem('user_data', JSON.stringify(updatedUser));

                    // 2. Hapus cache lokal lama
                    localStorage.removeItem('user_avatar');

                    // 3. Render ulang UI halaman dengan data baru
                    renderProfileData(); 
                    closeProfileModal();
                    alert('Berhasil memperbaharui profil!');
                } else {
                    alert(result.message || 'Gagal memperbarui profil.');
                }
            } catch (error) {
                console.error('Error update profile:', error);
                alert('Terjadi kesalahan koneksi ke server.');
            } finally {
                btnSaveProfile.disabled = false;
                btnSaveProfile.textContent = 'Simpan';
            }
        });

        // 4. Pengolahan Gambar Crop & Rotate
        inputAvatar.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    cropImage.src = event.target.result;
                    cropModal.classList.remove('hidden');

                    if (cropper) {
                        cropper.destroy();
                    }

                    cropper = new Cropper(cropImage, {
                        aspectRatio: 1, // Ratio 1:1 Lingkaran
                        viewMode: 1,
                        background: false
                    });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        btnRotateLeft.addEventListener('click', () => cropper && cropper.rotate(-90));
        btnRotateRight.addEventListener('click', () => cropper && cropper.rotate(90));

        function closeCropModal() {
            cropModal.classList.add('hidden');
            inputAvatar.value = '';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        btnCloseCrop.addEventListener('click', closeCropModal);
        btnCancelCrop.addEventListener('click', closeCropModal);

        btnApplyCrop.addEventListener('click', () => {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({
                    width: 300,
                    height: 300
                });
                tempCroppedImageBase64 = canvas.toDataURL('image/jpeg');
                modalAvatarImg.src = tempCroppedImageBase64;
                modalAvatarImg.classList.remove('hidden');
                modalAvatarSvg.classList.add('hidden');
                closeCropModal();
            }
        });

        // Logout & Sidebar Control
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            window.location.href = '../login/login.html';
        });

        const toggleSidebarNav = document.getElementById('toggleSidebarNav');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            if (window.innerWidth >= 768) return;

            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        toggleSidebarNav.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
                toggleSidebarNav.disabled = true;
            } else {
                sidebar.classList.add('-translate-x-full');
                toggleSidebarNav.disabled = false;
            }
        });

        if (window.innerWidth >= 768) {
            toggleSidebarNav.disabled = true;
        }
    </script>
</body>
</html>
