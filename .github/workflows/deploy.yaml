name: 🚀 Deploy Laravel to DomaiNesia Shared Hosting (No SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 📦 Build and FTP Upload
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: 🚀 Deploy to DomaiNesia via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .env
            .env.example
            *.sql
            **/*.sql
            *.md
            phpunit.xml
            .github/**

      - name: 🧹 Cleanup Diagnostic File
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          from ftplib import FTP
          import os
          try:
              ftp = FTP(os.environ['FTP_SERVER'], timeout=30)
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              try:
                  ftp.delete('test_ftp_dir.txt')
              except Exception:
                  pass
              ftp.quit()
          except Exception:
              pass
          "

      - name: ⚡ Trigger Database Migration & Cache Clear
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          TOKEN="${DEPLOY_SECRET:-skansaba_super_secret_token_12345}"
          curl -sS -k "https://ukk-scp-yudhis.my.id/api/deploy-migrate-${TOKEN}?seed=0" || echo "Webhook executed."
