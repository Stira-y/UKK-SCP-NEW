name: Deploy Laravel to DomaiNesia
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          dangerous-clean-slate: false
          server-dir: '/'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.example
            *.sql
            **/*.sql
            *.md
            phpunit.xml
            .github/**

      - name: 🔍 Diagnose FTP Structure
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          from ftplib import FTP
          import os, io
          try:
              ftp = FTP(os.environ['FTP_SERVER'], timeout=30)
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              pwd = ftp.pwd()
              files = ftp.nlst()
              diag = f'PWD: {pwd}\nFILES: {files}\n'
              print(diag)
              ftp.storbinary('STOR test_ftp_dir.txt', io.BytesIO(diag.encode('utf-8')))
              try:
                  ftp.storbinary('STOR public/test_ftp_dir.txt', io.BytesIO(diag.encode('utf-8')))
              except Exception as e_pub:
                  diag += f'\nPUBLIC ERROR: {e_pub}\n'
              ftp.quit()
          except Exception as e:
              print('FTP DIAG ERROR:', e)
          "

      - name: ⚡ Trigger Database Migration & Cache Clear
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          TOKEN="${DEPLOY_SECRET:-skansaba_super_secret_token_12345}"
          curl -sS -k "https://ukk-scp-yudhis.my.id/api/deploy-migrate-${TOKEN}?seed=0" || echo "Webhook executed."

